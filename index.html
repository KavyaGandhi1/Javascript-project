<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech-to-Text Pad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Speech to Text Pad</h1>

    <div class="controls">
      <button id="start-btn"> Start Listening</button>
      <button id="stop-btn" disabled> Stop Listening</button>
      <button id="save-btn"> Save Note</button>
    </div>

    <label for="text-area" class="label">Live Transcription</label>
    <textarea id="text-area" rows="8" placeholder="Click Start and begin speaking..."></textarea>

    <h2>Saved Notes</h2>
    <ul id="notes-list"></ul>

   
  </div>

  <script src="script.js"></script>
</body>
</html>
